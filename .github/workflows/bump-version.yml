name: Bump version

on:
  workflow_dispatch: # Allows manual triggering from GitHub UI

jobs:
  bump_version:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    name: Bump version and create changelog with commitizen
    steps:
      # A bot token is used (instead of GITHUB_TOKEN) so that the pushed tag
      # triggers the publish workflow, and so it can push to a protected main.
      - uses: actions/create-github-app-token@v1
        id: app-token
        with:
          app-id: ${{ vars.ELEMENTSINTERACTIVE_BOT_APP_ID }}
          private-key: ${{ secrets.ELEMENTSINTERACTIVE_BOT_PRIVATE_KEY }}
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          persist-credentials: false
      - id: cz
        name: Create bump and changelog
        uses: commitizen-tools/commitizen-action@master
        with:
          github_token: ${{ steps.app-token.outputs.token }}
      - name: Print version
        run: echo "Bumped to version ${{ steps.cz.outputs.version }}"
