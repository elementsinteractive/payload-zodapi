name: Publish

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  publish_to_npm:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # npm trusted publishing (OIDC) + provenance
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 24 # npm >= 11.5.1 is required for trusted publishing
          cache: pnpm
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      # `pnpm pack` applies publishConfig (dist entrypoints); `npm publish` does the OIDC auth
      - name: Pack
        run: pnpm pack --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm
        run: npm publish "$RUNNER_TEMP"/elementsinteractive-payload-zodapi-*.tgz --provenance --access public

  release_notes:
    runs-on: ubuntu-latest
    needs: publish_to_npm
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
